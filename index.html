<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>道友請留步 v1.3 - 永恆仙途</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-app">
    <header>
        <h3 style="margin:0; font-weight:600; letter-spacing:1px;">道友請留步</h3>
        <span class="realm-badge" id="realm-badge">凡人</span>
        <div id="save-notice">✨ 存檔成功</div>
    </header>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('home')">洞府</div>
        <div class="nav-item" onclick="switchTab('shop')">坊市</div>
        <div class="nav-item" onclick="switchTab('adventure')">歷練</div>
        <div class="nav-item" onclick="switchTab('bag')">背包</div>
    </div>

    <div id="tab-home" class="content-area panel active">
        <div id="meditate-status" style="text-align:center; color:var(--color-mp); font-size:0.9em; margin-bottom:10px; display:none;">
            🧘 正在運功調息，氣血真元快速恢復中...
        </div>

        <div class="status-group">
            <div class="status-row">
                <span class="status-label">氣血 HP <span id="rate-hp" class="rate-tag c-hp"></span></span>
                <span class="status-val" id="hp-val">100/100</span>
            </div>
            <div class="progress-track"><div class="progress-bar bg-hp" id="hp-bar"></div></div>
        </div>

        <div class="status-group">
            <div class="status-row">
                <span class="status-label">真元 MP <span id="rate-mp" class="rate-tag c-mp"></span></span>
                <span class="status-val" id="mp-val">50/50</span>
            </div>
            <div class="progress-track"><div class="progress-bar bg-mp" id="mp-bar"></div></div>
        </div>

        <div class="status-group">
            <div class="status-row">
                <span class="status-label">修為 EXP <span id="rate-qi" class="rate-tag c-qi"></span></span>
                <span class="status-val" id="qi-val">0/100</span>
            </div>
            <div class="progress-track"><div class="progress-bar bg-qi" id="qi-bar"></div></div>
        </div>

        <div class="stat-card">
            <div class="stat-item"><span>攻擊力</span><strong id="atk-disp">10</strong></div>
            <div class="stat-item"><span>防禦力</span><strong id="def-disp">2</strong></div>
            <div class="stat-item"><span>靈石</span><strong id="gold-disp" style="color:var(--color-gold)">0</strong></div>
        </div>

        <div style="display:grid; gap:10px;">
            <button class="btn btn-meditate" id="btn-meditate" onclick="toggleMeditate()">
                <span>🧘</span> 開始打坐調息
            </button>
            <button class="btn btn-cultivate" id="btn-cultivate" onclick="clickCultivate(event)">
                <span>⚡</span> 點擊修煉 (獲取修為)
            </button>
            <button class="btn btn-break" id="btn-breakthrough" style="display:none;" onclick="openBreakModal()">
                <span>🔥</span> 境界突破
            </button>
            <button class="btn" id="btn-max-level" style="display:none; cursor:default; opacity:0.7; border-color:var(--color-gold); color:var(--color-gold);">
                <span>👑</span> 已臻化境 (版本上限)
            </button>
        </div>

        <div style="margin-top: 25px; border-top: 1px solid var(--border-color); padding-top: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn" style="font-size: 0.8em; padding: 8px; border-color: var(--text-dim); color: var(--text-dim);" onclick="saveGame(true)">
                💾 立即存檔
            </button>
            <button class="btn" style="font-size: 0.8em; padding: 8px; border-color: var(--color-hp); color: var(--color-hp);" onclick="resetGame()">
                ⚠️ 重入輪迴 (刪檔)
            </button>
        </div>
    </div>

    <div id="tab-shop" class="content-area panel">
        <div style="text-align:center; margin-bottom:15px; font-size:0.9em; color:var(--text-dim);">
            持有靈石：<span id="shop-gold" style="color:var(--color-gold); font-weight:bold; font-size:1.1em;">0</span>
        </div>
        <div class="shop-grid" id="shop-container"></div>
    </div>

    <div id="tab-adventure" class="content-area panel">
        <div style="text-align:center; padding:30px 0; color:var(--text-dim);">
            <div style="font-size:3em; margin-bottom:10px;">🌲</div>
            <h3>迷霧森林</h3>
            <p>妖獸出沒，請多加小心。</p>
        </div>
        <button class="btn btn-primary" onclick="explore()">開始探索</button>
    </div>

    <div id="tab-bag" class="content-area panel">
        <div id="bag-list" style="display:grid; gap:10px;">
            <div style="text-align:center; padding:20px; color:var(--text-dim);">背包空空如也</div>
        </div>
    </div>

    <div class="log-container" id="game-log"></div>

    <div id="break-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="color:var(--color-qi);">⚡ 渡劫突破 ⚡</h3>
            <p style="font-size:0.9em; color:var(--text-dim);">目標境界：<span id="target-realm"></span></p>
            <div class="circle-wrap">
                <svg viewBox="0 0 36 36" class="circular-chart">
                    <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    <path id="circle-path" class="circle" stroke-dasharray="80, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                </svg>
                <div class="percentage-text" id="success-rate-text">80%</div>
            </div>
            
            <div style="margin-bottom:20px; text-align:left;">
                <label style="font-size:0.8em; color:var(--text-dim);">輔助丹藥</label>
                <select id="break-item-select" class="custom-select" onchange="updateRate()">
                    <option value="">不使用</option>
                </select>
                <div id="pill-desc" style="font-size:0.75em; color:var(--color-mp); margin-top:4px; height:1.2em;"></div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <button class="btn" onclick="closeBreakModal()">放棄</button>
                <button class="btn btn-primary" onclick="doBreakthrough()">開始</button>
            </div>
        </div>
    </div>

    <div id="combat-modal" class="modal-overlay">
        <div class="modal-content" style="max-width:360px;">
            <div class="combat-avatar" id="mob-icon"></div>
            <h3 id="mob-name"></h3>
            <div class="progress-track" style="background:#333; height:12px; margin:10px 0;">
                <div class="progress-bar" id="mob-hp-bar" style="background:var(--color-hp); width:100%;"></div>
            </div>
            <div style="font-size:0.8em; color:var(--text-dim); margin-bottom:20px;">HP: <span id="mob-hp-text"></span></div>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <div style="flex:1"><div class="progress-track"><div class="progress-bar bg-hp" id="c-hp-bar" style="width:100%"></div></div></div>
                <div style="flex:1"><div class="progress-track"><div class="progress-bar bg-mp" id="c-mp-bar" style="width:100%"></div></div></div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <button class="btn" onclick="combatAction('attack')">普攻</button>
                <button class="btn" onclick="combatAction('skill1')">掌心雷 <span style="font-size:0.7em; color:var(--color-mp);">-20</span></button>
                <button class="btn" onclick="combatAction('skill2')">回春術 <span style="font-size:0.7em; color:var(--color-mp);">-30</span></button>
                <button class="btn btn-danger" onclick="flee()">逃跑</button>
            </div>
            <div id="combat-msg" style="margin-top:15px; font-size:0.8em; height:1.5em; color:var(--color-gold);"></div>
        </div>
    </div>
</div>

<script src="game.js"></script>

</body>
</html>
